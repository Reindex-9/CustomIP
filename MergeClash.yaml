# =========================================================================
# Clash Verge 全局扩展覆写 (Merge)
# =========================================================================
# 执行顺序：原始订阅 -> 全局扩展覆写 (Merge) -> 全局扩展脚本 (Scripts)
#
# 说明：
# 1. 此处可放置任意标准 Mihomo 全局覆写参数（如 tun、端口设置等）。
# 2. 下方 static-proxy 为扩展脚本约定的静态代理配置块，脚本会自动读取其全部连接参数并生成链式代理组，随后从最终配置中清理该临时字段。
# 3. 若需临时停用静态代理，将 server 留空 ("") 或注释整段 static-proxy 即可。
# 4. yaml注释用#，js注释用//，如果直接复制配置需确保注释符号正确。
# =========================================================================

static-proxy:
  type: socks5           # 支持 socks5 / http / vless / trojan / ss / hysteria2 等任意 Mihomo 协议
  server: ""             # 静态 IP 地址或域名（留空则脚本自动跳过链式代理生成）
  port: 109              # 端口号 (1 - 65535)
  username: ""           # 鉴权用户名（无鉴权可留空或删除此行）
  password: ""           # 鉴权密码（无鉴权可留空或删除此行）
  udp: true              # 是否启用 UDP 转发

  # -----------------------------------------------------------------------
  # 其他协议参数参考（脚本会完整继承此块下的所有字段）：
  #
  # HTTP(S) 代理：
  #   type: http
  #   tls: true
  #   skip-cert-verify: false
  #
  # Trojan / VLESS 代理：
  #   type: trojan         # 或 vless（需将 password 替换为 uuid）
  #   sni: example.com
  #   skip-cert-verify: false
  # -----------------------------------------------------------------------
