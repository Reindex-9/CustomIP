# Clash Verge 多机场节点聚合配置（配合全局覆写脚本使用）
# 用法：新建 Local 本地配置 -> 粘贴本文件 -> 替换下方 url、path 和前缀即可
# 注意：1.每家 path 必须不同；2.若策略组无节点，检查全局脚本是否支持 include-all-providers: true

# 公共模板（下方机场自动继承）
p_common: &p_common
  type: http
  interval: 86400
  exclude-filter: "剩余流量|套餐到期|官网|重置|过期|网址|过滤|公告|到期|流量"
  health-check:
    enable: true
    interval: 600
    lazy: true # 仅用到时测速，省流量
    url: http://www.gstatic.com/generate_204

proxy-providers:
  机场1:
    <<: *p_common
    url: "这里填机场1订阅链接"
    path: ./proxy_provider/airport_1.yaml
    override:
      additional-prefix: "[机场1] "
    # 拉取失败时取消下面两行注释：
    # header:
    #   User-Agent: ["clash.meta"]

  机场2:
    <<: *p_common
    url: "这里填机场2订阅链接"
    path: ./proxy_provider/airport_2.yaml
    override:
      additional-prefix: "[机场2] "

  机场3:
    <<: *p_common
    url: "这里填机场3订阅链接"
    path: ./proxy_provider/airport_3.yaml
    override:
      additional-prefix: "[机场3] "

  机场4:
    <<: *p_common
    url: "这里填机场4订阅链接"
    path: ./proxy_provider/airport_4.yaml
    override:
      additional-prefix: "[机场4] "

  机场5:
    <<: *p_common
    url: "这里填机场5订阅链接"
    path: ./proxy_provider/airport_5.yaml
    override:
      additional-prefix: "[机场5] "

  机场6:
    <<: *p_common
    url: "这里填机场6订阅链接"
    path: ./proxy_provider/airport_6.yaml
    override:
      additional-prefix: "[机场6] "

# 占位策略组（防校验报错，通常会被全局脚本覆盖）
proxy-groups:
  - name: "节点选择"
    type: select
    include-all-providers: true
