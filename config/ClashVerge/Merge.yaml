# =========================================================================
# Clash Verge 全局扩展覆写 (Merge) - 适配 Scripts v3.3
# =========================================================================
# 执行顺序：原始订阅 -> 全局扩展覆写 (Merge) -> 全局扩展脚本 (Scripts)
#
# 使用说明：
# 1. 此处可放置任意标准 Mihomo 全局覆写参数（如 tun、端口设置等）。
# 2. static-proxies 为脚本约定的临时字段，读取后会自动清理，不残留到最终配置。
# 3. 每个有效条目会独立生成一个手动策略组「🏠 静态 · <name>」和一个隐藏测速探针；
#    停用某条目只需将 server 留空 ("") 或注释该段即可。
# 4. nodes 不设数量上限，可直接粘贴测速脚本输出的完整列表；脚本会按顺序截取当前订阅中
#    命中的前 15 个显示，切回单机场订阅时后续节点会自动前移补位。
# 5. region 用于新 IP 未测速时的过渡与底部兜底，支持国家/地区缩写（不区分大小写，多选用逗号隔开）：
#    - 地区缩写：US(美国) / HKTW(港澳台) / JPKRSG(日韩新) / EU(欧洲) / LOW(低价区) / OTHER(其他地区)
#    - 国家缩写：HK / TW / MO / JP / KR / SG / DE / GB / UK / FR / IT / NL / CA / AU / TR / AR / IN 等
#    - 同时兼容旧版数字编号 1-6
# =========================================================================

# 单机场订阅去前缀匹配辅助（留空则自动尝试用订阅名匹配；订阅名非机场名时可手动填写）
# current-airport: ""

# 覆盖单个静态 IP 面板最大显示节点数（默认 15，不建议过大，防误触全组测速时高并发撞击静态 IP）
# max-static-nodes: 15

static-proxies:
  - name: "美国"                # 面板显示名与测速目标名（勿留空或重名；改名会导致已记忆的策略组选中状态重置）
    type: socks5                # 支持 socks5 / http / vless / trojan / ss / hysteria2 等任意 Mihomo 协议
    server: ""                  # 静态 IP 地址或域名（留空或填占位符则跳过该条目）
    port: 7213                  # 端口号 (1 - 65535)
    username: ""                # 鉴权用户名（无鉴权可留空或删除；多条共用同 IP:端口 网关时脚本会自动按此隔离历史库）
    password: ""                # 鉴权密码（无鉴权可留空或删除）
    udp: true                   # 是否启用 UDP 转发
    region: "US"                # 底部兜底地区组（仅挂载对应地区组，不挂 Auto；如 "US" 或 "JP,SG"）
    nodes: []                   # 达标前置节点池：直接粘贴 latest_recommendation.yaml 中对应段落的 nodes

  # 第二个静态 IP
  - name: "日本"
    type: socks5
    server: ""
    port: 
    username: ""
    password: ""
    udp: true
    region: "JP"
    nodes: []

  # -----------------------------------------------------------------------
  # 其他协议参数参考（脚本会完整继承每条静态代理下的全部 Mihomo 协议字段）：
  #
  # HTTP(S) 代理：
  #   type: http
  #   tls: true
  #   skip-cert-verify: false
  #
  # Trojan / VLESS 代理：
  #   type: trojan         # 或 vless（需将 password 替换为 uuid）
  #   sni: example.com
  #   skip-cert-verify: false
  # -----------------------------------------------------------------------
